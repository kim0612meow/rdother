<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한 끼의 무게 · 배경음악 후보</title>
<style>*{box-sizing:border-box}body{margin:0;background:#14221d;color:#f7f1dd;font:17px/1.65 system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:30px 24px 60px}h1{font-size:30px;margin:0 0 8px}p{margin:8px 0;color:#c9d4c5}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:22px 0}a{color:#f1cf87}button{background:#f1cf87;color:#17291f;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}article{background:#20372d;border:1px solid #4c6757;border-radius:14px;padding:22px}h2{font-size:19px;color:#f1cf87;margin:0}h3{font-size:22px;margin:9px 0 0}small{color:#b5c5b5}audio{width:100%;margin:16px 0 8px}.links{display:flex;gap:14px;flex-wrap:wrap}.credit{font-size:13px;overflow-wrap:anywhere}.status{font-size:14px;color:#efbfa9}input{vertical-align:middle}</style>
<main><h1>배경음악 후보</h1><p>거리 2곡 · 가게 2곡. 아직 게임에는 적용하지 않았습니다. 원본을 재생하므로 실제 게임 음량과 다릅니다.</p><p>제작자의 설명을 기준으로 고른 후보입니다. 직접 들어보고 장소와 어울리는 조합을 골라주세요.</p><nav><button id="stop">모두 정지</button><label>미리듣기 음량 <input id="volume" aria-label="미리듣기 음량" type="range" min="0" max="1" step="0.01" value="0.12"></label><a href="./?v=indoor-audio-v34">게임으로</a></nav><section class="grid" id="tracks"></section><p>CC0는 상업적 사용·편집이 가능하며 출처 표기는 의무가 아닙니다. CC BY 4.0는 출처와 라이선스를 표기하고, 편집했다면 변경 사실도 표시해야 합니다. 각 원본 게시물과 라이선스를 연결해 두었습니다.</p></main>
<script>
const tracks=[{"id":"street-1","place":"거리 ① · 은밀한 분위기","title":"Hidden Agenda","author":"Kevin MacLeod","note":"작곡가가 은밀하게 돌아다니는 장면용으로 소개한 곡. 코믹한 긴장감을 원할 때 비교할 후보입니다.","url":"https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1200102","audio":"https://incompetech.com/music/royalty-free/mp3-royaltyfree/Hidden%20Agenda.mp3","license":"CC BY 4.0 · 출처 표기 필요","licenseUrl":"https://creativecommons.org/licenses/by/4.0/","credit":"“Hidden Agenda” Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 4.0 License. https://creativecommons.org/licenses/by/4.0/ · 미리듣기는 원본이며 편집하지 않았습니다."},{"id":"street-2","place":"거리 ② · 시장 분위기","title":"Medieval: Market Day","author":"RandomMind","note":"작곡가가 시장을 주제로 만든 곡. 긴장감보다 거리의 생활감을 살리는 방향입니다. 원본에 반복용 버전도 있습니다.","url":"https://opengameart.org/content/medieval-market-day","audio":"https://opengameart.org/sites/default/files/Loop_Market_Day_0.mp3","license":"CC0 · 출처 표기 의무 없음","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/"},{"id":"shop-1","place":"가게 ① · 여인숙 / 작은 가게","title":"Medieval: The Old Tower Inn","author":"RandomMind","note":"여인숙 테마로 공개된 곡. 거리와 구분되는 가게 분위기 후보입니다. 원본에 반복용 버전도 있습니다.","url":"https://opengameart.org/content/medieval-the-old-tower-inn","audio":"https://opengameart.org/sites/default/files/The_Old_Tower_Inn.mp3","license":"CC0 · 출처 표기 의무 없음","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/"},{"id":"shop-2","place":"가게 ② · 차분한 탐색 분위기","title":"Medieval: Exploration","author":"RandomMind","note":"메뉴·탐색용으로 공개된 곡. 구매할 때 효과음을 가리지 않게 작게 깔아볼 대안입니다.","url":"https://opengameart.org/content/medieval-exploration","audio":"https://opengameart.org/sites/default/files/Exploration_0.mp3","license":"CC0 · 출처 표기 의무 없음","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/"}];
const root=document.getElementById('tracks');for(const track of tracks){const card=document.createElement('article');card.innerHTML='<h2>'+track.place+'</h2><h3>'+track.title+'</h3><small>'+track.author+'</small><p>'+track.note+'</p><audio controls preload="none" aria-label="'+track.title+' 미리듣기" src="'+track.audio+'"></audio><div class="links"><a target="_blank" rel="noopener" href="'+track.url+'">원본 게시물</a><a target="_blank" rel="noopener" href="'+track.licenseUrl+'">'+track.license+'</a></div>'+(track.credit?'<p class="credit">'+track.credit+'</p>':'')+'<p class="status" role="status"></p>';root.append(card);}
const players=[...document.querySelectorAll('audio')];for(const player of players){player.volume=.12;player.addEventListener('play',()=>players.forEach(other=>{if(other!==player)other.pause();}));player.addEventListener('error',()=>player.closest('article').querySelector('.status').textContent='원본 서버에서 재생하지 못했습니다. 원본 게시물에서 들어주세요.');}document.getElementById('volume').oninput=e=>players.forEach(player=>player.volume=Number(e.target.value));document.getElementById('stop').onclick=()=>players.forEach(player=>{player.pause();player.currentTime=0;});
</script></html>
