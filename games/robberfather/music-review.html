<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한 끼의 무게 · 배경음악 후보</title>
<style>*{box-sizing:border-box}body{margin:0;background:#14221d;color:#f7f1dd;font:17px/1.65 system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:30px 24px 60px}h1{font-size:30px;margin:0 0 8px}p{margin:8px 0;color:#c9d4c5}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:22px 0}a{color:#f1cf87}button{background:#f1cf87;color:#17291f;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}article{background:#20372d;border:1px solid #4c6757;border-radius:14px;padding:22px}h2{font-size:19px;color:#f1cf87;margin:0}h3{font-size:22px;margin:9px 0 0}small{color:#b5c5b5}audio{width:100%;margin:16px 0 8px}.links{display:flex;gap:14px;flex-wrap:wrap}.credit{font-size:13px;overflow-wrap:anywhere}.status{font-size:14px;color:#efbfa9}input{vertical-align:middle}</style>
<main><h1>배경음악 후보</h1><p>느긋하고 조용한 음악 4곡 · 거리·가게용 비교. 이전 후보 4곡은 제외했습니다. 아직 게임에는 적용하지 않았습니다.</p><p>피아노·앰비언트 중심으로 다시 골랐습니다. 설명은 제작자의 악기·분위기 분류를 기준으로 썼습니다. 원본을 작게 재생하니 음량을 조절해 비교해 주세요.</p><nav><button id="stop">모두 정지</button><label>미리듣기 음량 <input id="volume" aria-label="미리듣기 음량" type="range" min="0" max="1" step="0.01" value="0.12"></label><a href="./?v=indoor-audio-v34">게임으로</a></nav><section class="grid" id="tracks"></section><p>CC0는 상업적 사용·편집이 가능하며 출처 표기는 의무가 아닙니다. CC BY 4.0는 출처와 라이선스를 표기하고, 편집했다면 변경 사실도 표시해야 합니다. 각 원본 게시물과 라이선스를 연결해 두었습니다.</p></main>
<script>
const tracks=[{"id":"quiet-1","place":"① · 조용한 앰비언트 루프","title":"Sunset Walk","author":"Kilua Boy","note":"제작자가 조용한 앰비언트 루프로 소개한 곡입니다. 짧은 멜로디가 반복되는 방향으로, 거리와 가게 양쪽에서 비교할 첫 후보입니다.","url":"https://opengameart.org/content/sunset-walk-ambient-quiet-sweet-loop","audio":"https://opengameart.org/sites/default/files/SunsetWalk.ogg","license":"CC0 · 출처 표기 의무 없음","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/","credit":"Sunset Walk — Kilua Boy · CC0. 자발적 출처 표기."},{"id":"quiet-2","place":"② · 느긋한 피아노와 신스","title":"Relaxing Piano Music","author":"Kevin MacLeod","note":"피아노와 신스로 구성된 약 25분의 곡입니다. 제작자가 차분하고 편안한 분위기로 분류한 후보로, 재생 막대를 움직여 중간 부분도 비교해 보세요.","url":"https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1500075","audio":"https://incompetech.com/music/royalty-free/mp3-royaltyfree/Relaxing%20Piano%20Music.mp3","license":"CC BY 4.0 · 출처 표기 필요","licenseUrl":"https://creativecommons.org/licenses/by/4.0/","credit":"“Relaxing Piano Music” Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 4.0 License. https://creativecommons.org/licenses/by/4.0/ · 원본 미리듣기, 편집 없음."},{"id":"quiet-3","place":"③ · 부드러운 피아노와 패드","title":"Calm Piano 1 (Vaporware)","author":"The Cynic Project","note":"제작자가 편안한 패드와 밝은 피아노 선율로 설명한 곡입니다. 너무 쓸쓸하지 않은 가게 분위기를 비교해 볼 후보입니다.","url":"https://opengameart.org/content/calm-piano-1-vaporware","audio":"https://opengameart.org/sites/default/files/003_Vaporware_2.mp3","license":"CC0 · 출처 표기 의무 없음","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/","credit":"The Cynic Project / cynicmusic.com / pixelsphere.org · CC0. 자발적 출처 표기."},{"id":"quiet-4","place":"④ · 느린 피아노와 타악기","title":"Dream Culture","author":"Kevin MacLeod","note":"70 BPM의 피아노·타악기 곡으로, 제작자가 차분하고 느긋한 분위기로 분류했습니다. 다른 후보보다 리듬이 있는 비교용입니다.","url":"https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1300046","audio":"https://incompetech.com/music/royalty-free/mp3-royaltyfree/Dream%20Culture.mp3","license":"CC BY 4.0 · 출처 표기 필요","licenseUrl":"https://creativecommons.org/licenses/by/4.0/","credit":"“Dream Culture” Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 4.0 License. https://creativecommons.org/licenses/by/4.0/ · 원본 미리듣기, 편집 없음."}];
const root=document.getElementById('tracks');for(const track of tracks){const card=document.createElement('article');card.innerHTML='<h2>'+track.place+'</h2><h3>'+track.title+'</h3><small>'+track.author+'</small><p>'+track.note+'</p><audio controls preload="none" aria-label="'+track.title+' 미리듣기" src="'+track.audio+'"></audio><div class="links"><a target="_blank" rel="noopener" href="'+track.url+'">원본 게시물</a><a target="_blank" rel="noopener" href="'+track.licenseUrl+'">'+track.license+'</a></div>'+(track.credit?'<p class="credit">'+track.credit+'</p>':'')+'<p class="status" role="status"></p>';root.append(card);}
const players=[...document.querySelectorAll('audio')];for(const player of players){player.volume=.12;player.addEventListener('play',()=>players.forEach(other=>{if(other!==player)other.pause();}));player.addEventListener('error',()=>player.closest('article').querySelector('.status').textContent='원본 서버에서 재생하지 못했습니다. 원본 게시물에서 들어주세요.');}document.getElementById('volume').oninput=e=>players.forEach(player=>player.volume=Number(e.target.value));document.getElementById('stop').onclick=()=>players.forEach(player=>{player.pause();player.currentTime=0;});
</script></html>
