<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16201e"><meta name="description" content="A story of a pickpocket, a waiting son, and one more meal. A 2D survival game."><title>One More Meal</title>
 <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316201e'/%3E%3Cpath d='M12 32h40v8L42 50H22L12 40Z' fill='%23d6b77a'/%3E%3Cpath d='M22 25v-9m10 9V12m10 13v-9' stroke='%23d6b77a' stroke-width='4'/%3E%3C/svg%3E">
 <link rel="stylesheet" href="game.css?v=audio-credits-v39">
</head>
<body>
  <section class="game-stage is-intro" id="stage" aria-label="One More Meal">
   <canvas id="game" width="1440" height="840" tabindex="0" aria-label="2D survival game"></canvas>
   <button id="pauseBtn" class="pause-button" aria-label="Pause">Ⅱ</button>
   <div id="hud" class="game-hud"><span id="dayNumber"></span><span id="healthNote" hidden></span></div>
   <div class="day-clock" id="dayClock"><span data-i18n="untilDusk"></span><strong id="timeLeft">02:30</strong></div>
   <div id="intro" class="intro"><div class="intro-content"><h1 data-i18n="title"></h1><p data-i18n="introOneLine"></p><button id="continueBtn" class="primary-button" hidden></button><button id="startBtn" class="primary-button" data-i18n="start"></button></div></div>
   <section id="prologue" class="prologue" aria-label="Opening scene" hidden><button id="prologueNext" class="prologue-copy"><span id="prologueText"></span><small data-i18n="clickNext"></small></button><button id="prologueSkip" class="prologue-skip" data-i18n="skipPrologue"></button></section>
   <button id="homePrompt" class="home-prompt" hidden><kbd data-control="home">M</kbd><div><strong id="homePromptTitle"></strong></div></button>
   <div id="chaseTag" class="chase-tag" hidden><strong data-i18n="chase"></strong></div>
   <section id="dayNotice" class="day-notice" role="status" aria-live="polite" hidden><strong id="dayNoticeTitle"></strong><p id="dayNoticeCopy"></p></section>
   <div id="toast" class="toast" role="status" aria-live="polite"></div>
   <div id="targetCard" class="target-card" hidden><div class="target-card-top"><kbd data-control="steal">E</kbd><div><div class="target-heading"><strong id="targetName"></strong><span id="targetLevel" class="difficulty-label"></span></div><small id="targetDetail"></small></div><b id="targetReward"></b></div><div class="suspicion-row"><span data-i18n="suspicion"></span><div><i id="suspicionBar"></i></div><span id="riskLabel"></span></div></div>
   <div id="fullPocketsNotice" class="full-pockets-notice" role="status" data-i18n="coinsFullNotice" hidden></div>
   <div id="coverGuide" class="cover-guide" role="status" hidden><strong data-i18n="practiceCoverTitle"></strong><span><kbd id="coverGuideKey"></kbd><span id="coverGuideAction"></span></span><b id="coverGuideArrow" aria-hidden="true">↓</b></div>
   <div id="shopGuide" class="cover-guide shop-guide" role="status" hidden><span><kbd id="shopGuideKey"></kbd><span id="shopGuideText"></span></span><b id="shopGuideArrow" aria-hidden="true">↓</b></div>
   <div id="tutorial" class="tutorial" role="status"><kbd class="tutorial-arrow" id="tutorialKey">↔</kbd><p id="tutorialText"></p></div>
   <div id="tutorialSkip" class="tutorial-skip" role="progressbar" aria-label="Hold to skip tutorial" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span><kbd data-control="skipTutorial">T</kbd> <span data-i18n="tutorialSkipHint"></span></span><div><i id="tutorialSkipBar"></i></div></div>
   <div class="bottom-hud" id="resourceHud">
    <div class="hud-group"><span data-i18n="coinTitle"></span><div class="hud-slots" id="coinSlots" role="group"></div></div>
    <div class="hud-group"><span id="mealTarget"></span><div class="hud-slots" id="foodSlots" role="group"></div></div>
    <div class="hud-group"><span data-i18n="chances"></span><div class="hud-slots" id="attemptSlots" role="group"></div></div>
   </div>
   <div class="discard-note" id="discardNote" hidden><span data-i18n="holdDiscard"></span><div><i id="discardBar"></i></div></div>
   <div class="stamina" id="staminaWrap" hidden><span id="staminaLabel"></span><div><i id="staminaBar"></i></div></div>
   <div id="cinema" class="cinema" hidden><div class="cinema-top"><span id="cinemaDay"></span><small data-i18n="nightKicker"></small></div><div class="cinema-copy"><h2 id="nightTitle"></h2><p id="mealCopy"></p><button id="nextDayBtn" class="primary-button"><span id="nextDayText"></span><b>→</b></button></div><div class="night-summary"><span><span data-i18n="nightEarned"></span> <b id="nightEarned"></b></span><span><span data-i18n="nightSpent"></span> <b id="nightSpent"></b></span></div></div>
   <button id="binGuide" class="cover-guide bin-guide" hidden><span><kbd data-control="hide">F</kbd> <span data-i18n="inspectBinAction"></span></span><b id="binGuideArrow" aria-hidden="true">↓</b></button>
   <div id="binCard" class="bin-card" hidden><span class="eyebrow" data-i18n="binTitle"></span><p id="binContents"></p><div><button id="binTake" data-i18n="takeFood"></button><button id="binLeave" data-i18n="leaveFood"></button></div></div>
   <div id="hidePrompt" class="hide-prompt" hidden></div>
   <div id="doorPrompt" class="hide-prompt door-prompt" hidden></div><div id="shopPrompt" class="hide-prompt door-prompt shop-prompt" hidden></div>
   <div id="pickpocket" class="pickpocket" hidden><div class="pick-top"><strong data-pick-title></strong><p data-pick-hint></p></div><canvas width="640" height="400"></canvas><div class="pick-bottom"><div class="pick-track"><i data-pick-bar></i></div></div></div>
   <div id="shell" class="pickpocket shell" hidden><div class="pick-top"><strong data-i18n="shellTitle"></strong><small data-i18n="shellHint"></small></div><canvas width="640" height="360"></canvas><div class="pick-bottom"><span data-shell-note></span><small class="shell-net" data-shell-net></small><button class="primary-button shell-bet" data-shell-bet><span data-i18n="shellBet"></span></button><button id="shellExit" class="shell-exit"><kbd data-control="steal">E</kbd> <span data-i18n="shellExit"></span></button><small data-shell-exit-note data-i18n="shellForfeit" hidden></small></div></div>
   <section id="dialogue" class="dialogue" role="dialog" aria-labelledby="sonSpeaker" hidden><div class="dialogue-top"><span id="sonSpeaker" data-i18n="son"></span><small id="dialogueCount"></small></div><p id="sonLine"></p><div class="dialogue-bottom"><button id="dialogueNext" class="primary-button"><span></span><b>→</b></button></div></section>
   <div id="endingOverlay" class="ending-overlay" hidden><div class="cinema-top"><span data-i18n="endingLabel"></span></div><div class="ending-copy"><h2 id="endingTitle"></h2><p id="endingCaption"></p><button id="endingSkip" class="ending-skip" data-i18n="skipEnding"></button><button id="endingRestart" class="primary-button" disabled><span data-i18n="overAction"></span><b>→</b></button></div></div>
   <div id="fade" class="fade"></div>
<div class="modal-backdrop" id="modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
<button id="closeModal" class="modal-close" aria-label="Back">←</button><h2 id="modalTitle"></h2><div id="modalBody"></div>
<div id="preferences" hidden><button id="soundBtn" data-i18n="toggleSound"></button></div>
<button id="modalAction" class="primary-button"><span></span></button><button id="modalCancel" class="modal-cancel" data-i18n="cancel" hidden></button><div id="pauseChoices" hidden><button id="volumeTab" data-i18n="volume"></button><button id="controlsTab" data-i18n="controlsTitle"></button><button id="helpBtn" data-i18n="guide"></button><button id="restartBtn" data-i18n="restartStory"></button></div>
<aside id="pauseTools" class="pause-tools" hidden><button id="saveBtn" class="primary-button" data-i18n="save"></button><select id="localeSelect" aria-label="Language"><option value="en">EN</option><option value="ko">한국어</option></select><button id="fullscreenBtn" data-i18n="fullscreen"></button></aside>
</section></div>
</section>
<script type="module" src="app.js?v=audio-credits-v39"></script>
</body></html>
