<!doctype html><html lang="en"><meta charset="utf-8"><title>Robberfather · character and gameplay checks</title>
<style>body{background:#222936;color:#e8dcc4;font:16px system-ui;margin:32px auto;max-width:1200px}h1{font:32px Georgia}p{color:#bfc2c7}button{padding:14px;margin:5px;background:#526b61;color:#fff;border:1px solid #9caa99;cursor:pointer}canvas{width:100%;image-rendering:pixelated;background:#d8d4c7}#result{white-space:pre-wrap}</style>
<h1>One More Meal · Pixel sprite studio · revision 2</h1><p>Raster dot sprites, sampled to native pixels with a shared 24-colour palette per person. Full-body animation; no rectangle-built bodies. Local QA fixtures replace only this preview origin's save.</p>
<canvas id="sheet" width="1200" height="940"></canvas><p id="result"></p><div id="fixtures"></div>
<script type="module">
import {drawCharacter,drawChild,drawPocketBack,drawEating,drawCrouch,ready} from '/games/robberfather/characters.js?v=shops-v16';
import {Game,TUTORIAL,GROUND,SHOPS,BOXES} from '/games/robberfather/engine.js?v=shops-v16';
await ready;
const c=document.getElementById('sheet').getContext('2d');c.fillStyle='#d8d4c7';c.fillRect(0,0,1200,630);c.imageSmoothingEnabled=false;
const people=[['FATHER','father'],['SON','child'],['PASSERBY','civilian'],['WEALTHY','wealthy'],['POLICE','police'],['ALLEY MAN','thug']];
for(let i=0;i<people.length;i++){
 const [name,type]=people[i],x=95+i*195;
 drawCharacter(c,{x,y:270,type,face:1,walk:0,id:0},type==='father',type==='child'?3.4:3);
 c.fillStyle='#323541';c.font='14px monospace';c.textAlign='center';c.fillText(name,x,38);
 const el=document.createElement('canvas');el.width=150;el.height=250;const s=el.getContext('2d');
 drawCharacter(s,{x:70,y:240,type,face:1,walk:0,id:0},type==='father',3);
 s.globalCompositeOperation='source-in';s.fillStyle='#22232c';s.fillRect(0,0,150,250);c.drawImage(el,x-70,340);
}
const fresh=()=>{const g=new Game();g.start();for(let i=0;i<3;i++)g.advanceMorning();g.tutorialDone=true;g.tutorial=TUTORIAL.done;return g;};
const recovery=()=>{const g=fresh();g.goHome();g.beginNight();g.nextDay();for(let i=0;i<3;i++)g.advanceMorning();return g;};
const scenarios={
 'V16 · store doorway arrow':()=>{const g=fresh();g.tutorialDone=false;g.tutorial=TUTORIAL.shop;g.player.x=SHOPS[1].door+100;g.player.stamina=15;g.inventory=['coin'];return g;},
 'V16 · indoor counter arrow':()=>{const g=fresh();g.tutorialDone=false;g.tutorial=TUTORIAL.counter;g.player.x=SHOPS[1].x0+780;g.player.stamina=15;g.inventory=['coin'];return g;},
 'V16 · purchase arrow and breath':()=>{const g=fresh();g.tutorialDone=false;g.tutorial=TUTORIAL.purchase;g.player.x=SHOPS[1].x0+1110;g.player.stamina=15;g.inventory=['coin'];return g;},
 ...Object.fromEntries(['civilian','wealthy','police'].map(type=>['V16 · '+type+' reward and difficulty',()=>{const g=fresh();g.player.x=1300;const target=g.npcs.find(n=>n.type===type);for(const n of g.npcs)n.x=4300;Object.assign(target,{x:1342,face:1,pause:999});return g;}])),
 'V14 · hungry and ill morning':()=>{const g=recovery();g.rottenStreak=1;g.lastMeal='both';g.mode='morning';return g;},
 'V14 · hungry day three food':()=>{const g=recovery();g.inventory=Array(3).fill('fresh');return g;},
 'V14 · recovery five food dinner':()=>{const g=recovery();g.inventory=[...Array(5).fill('fresh'),'coin'];g.goHome();g.beginNight();return g;},
 'V14 · recovery three food dinner':()=>{const g=recovery();g.inventory=Array(3).fill('fresh');g.goHome();g.beginNight();return g;},
 'V14 · illness only':()=>{const g=fresh();g.day=3;g.rottenStreak=1;g.lastMeal='rotten';return g;},
 'V13 · food counter lesson':()=>{const g=fresh();g.tutorialDone=false;g.tutorial=TUTORIAL.counter;g.player.x=SHOPS[1].x0+1110;g.inventory=['coin'];return g;},
 'V13 · shop journey lesson':()=>{const g=fresh();g.tutorialDone=false;g.tutorial=TUTORIAL.buyIntro;g.player.x=1240;g.inventory=['coin'];return g;},
 'V13 · counter and NPC overlap':()=>{const g=fresh(),shop=SHOPS[1],target=g.npcs.find(n=>n.x>shop.x0&&n.x<shop.x1);g.player.x=shop.x0+1110;g.inventory=['coin','coin','coin'];for(const n of g.npcs)n.x=4300;Object.assign(target,{x:g.player.x+42,face:1,pause:999});return g;},
 'V13 · bin left for later':()=>{const g=fresh();g.player.x=g.bins[0].x;for(const n of g.npcs)n.x=4300;return g;},
 'V12 · full coins and rotten food':()=>{const g=fresh();g.player.x=1300;g.inventory=[...Array(5).fill('coin'),'rotten'];for(const n of g.npcs)n.x=4300;Object.assign(g.npcs[2],{x:1350,face:1,pause:999});return g;},
 'V11 · dinner centre':()=>{const g=fresh();g.day=14;g.inventory=['fresh','fresh','fresh'];g.goHome();g.beginNight();return g;},
 'V11 · day 14 pocket':()=>{const g=fresh();g.day=14;g.player.x=1300;for(const n of g.npcs)n.x=4300;Object.assign(g.npcs[2],{x:1350,face:1,pause:999});return g;},
 'V10 · QTE practice':()=>{const g=new Game();g.start();g.mode='day';g.player.x=748;g.npcs[0].face=1;g.tutorial=TUTORIAL.approach;g.update(.02,{pick:true,trace:1});return g;},
 'V10 · spotted practice':()=>{const g=new Game();g.start();g.mode='day';g.player.x=748;g.npcs[0].face=1;g.tutorial=TUTORIAL.approach;g.update(.02,{pick:true,trace:1});g.update(.02,{pick:true,trace:1,qteHit:true});g.update(.02,{pick:true,trace:1});g.dodge();for(let i=0;i<100;i++)g.update(.02);g.update(.02,{pick:true,trace:1});return g;},
 'V8 · street floor':()=>{const g=fresh();g.player.x=1480;return g;},
 'V8 · street cover':()=>{const g=fresh();g.player.x=BOXES[0].x;g.toggleHide();return g;},
 'V9 · central indoor cover':()=>{const g=fresh();g.player.x=BOXES.find(b=>b.id===10+SHOPS[1].id).x;g.toggleHide();return g;},
 'V9 · indoor centre standing':()=>{const g=fresh();g.player.x=SHOPS[1].x0+720;return g;},
 'V8 · full alley':()=>{const g=fresh();g.player.x=SHOPS.find(s=>s.kind===5).x0+650;return g;},

 'UI · HUD with one chance used':()=>{const g=fresh();g.player.x=1006;g.inventory=['coin','coin','fresh','fresh'];g.attempts=['caught'];return g;},
 'UI · first dialogue':()=>{const g=new Game();g.start();return g;},
 'UI · first tutorial':()=>{const g=new Game();g.start();for(let i=0;i<3;i++)g.advanceMorning();return g;},
 'Interior scale · exit':()=>{const g=fresh();g.player.x=SHOPS[1].x0+150;return g;},
 'Residential gap · loaded cart':()=>{const g=fresh();g.player.x=1320;return g;},
 'Cover cart · crouching':()=>{const g=fresh();g.player.x=BOXES[0].x;g.toggleHide();return g;},
 'Door alignment · corner store':()=>{const g=fresh();g.player.x=SHOPS[1].door;for(const n of g.npcs)n.x=4300;return g;},
 'Side alley · entrance':()=>{const g=fresh();g.player.x=SHOPS.find(s=>s.kind===5).x0+650;return g;},
 'Empty food · money in pocket':()=>{const g=fresh();g.inventory=['coin','coin'];return g;},
 'Full dinner · zero money':()=>{const g=fresh();g.inventory=['fresh','fresh','fresh'];return g;},
 'Rotten food counts as food':()=>{const g=fresh();g.inventory=['rotten'];return g;},
 'Dinner scene · father and son':()=>{const g=fresh();g.inventory=['fresh','fresh','fresh'];g.goHome();g.beginNight();return g;},
 'Street cast · walking silhouettes':()=>{const g=fresh();g.player.x=1200;const cast=[['civilian',1050],['civilian',1135],['wealthy',1380],['police',1510]];for(const n of g.npcs)n.x=4300;cast.forEach(([type,x],id)=>Object.assign(g.npcs[id],{type,x,y:GROUND,face:1,pause:999}));return g;},
 'Pocket close-up · wealthy':()=>{const g=fresh();g.player.x=1300;for(const n of g.npcs)n.x=4300;Object.assign(g.npcs[2],{x:1350,face:1,pause:999});return g;},
 'Timeout · no food':()=>{const g=fresh();g.timeLeft=.1;return g;},
 'Robbery ending · approach and head strike':()=>{const g=fresh();g.gambleNet=4;g.inventory=['coin','coin'];g.settleBet(true);return g;},
 'Arrest ending':()=>{const g=fresh();g.ending='arrest';g.mode='ending';return g;},
 'Collapse ending':()=>{const g=fresh();g.ending='collapse';g.mode='ending';return g;}
};
for(const [name,make]of Object.entries(scenarios)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{localStorage.setItem('one-more-meal-v3',JSON.stringify(make().save()));location.assign('/games/robberfather/');};document.getElementById('fixtures').append(b);}
// Both facing directions, every frame and story pose must render without errors.
let rendered=0;for(const [,type]of people)for(const face of [-1,1])for(const pose of ['stand','walk','seated'])for(let frame=0;frame<4;frame++){
 const tmp=document.createElement('canvas');tmp.width=180;tmp.height=250;
 drawCharacter(tmp.getContext('2d'),{x:90,y:240,type,id:0,face,walk:frame*Math.PI/2+.1,pose},type==='father',2);rendered++;
}
for(const type of ['civilian','wealthy','police'])for(const look of ['wait','warn','look']){const tmp=document.createElement('canvas');tmp.width=640;tmp.height=400;drawPocketBack(tmp.getContext('2d'),type,look,0);rendered++;}
for(const kind of ['father','child'])for(let i=0;i<4;i++){const tmp=document.createElement('canvas');tmp.width=180;tmp.height=160;drawEating(tmp.getContext('2d'),kind,90,150,2,i/2.6);rendered++;}
for(let i=0;i<4;i++){drawCrouch(c,180+i*270,910,i/3,3.6);rendered++;}document.getElementById('result').textContent=`PASS · ${rendered} character frames and pocket views rendered`;
</script></html>
