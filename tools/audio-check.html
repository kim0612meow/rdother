<!doctype html><html lang="en"><meta charset="utf-8"><title>Audio integration checks</title><style>body{font:17px system-ui;background:#182820;color:#eee;padding:24px}button{font:inherit;padding:12px;margin:4px}pre{white-space:pre-wrap}canvas{background:#eee;width:100%;max-width:1000px}</style><h1>Audio integration checks</h1><button id="load">Load local recordings</button><button id="open">Open lid</button><button id="close">Close lid</button><button id="night">Quiet night</button><button id="street">Street</button><label>Zoom focus <input id="focus" type="range" min="0" max="1" step="0.05" value="0"></label><button id="chase">Chase music</button><button id="qte">QTE success</button><button id="pocket">Pocket movement</button><button id="meal">Cutlery</button><button id="buy">Buy</button><button id="door">Door</button><button id="discard">Discard food</button><button id="entry">Pocket entry</button><button id="walk">Stone walk</button><button id="run">Stone run</button><button id="wood">Wood walk</button><button id="stop">Silence</button><pre id="report">Not loaded</pre><canvas id="wave" width="1000" height="140"></canvas><script type="module">
import {SampleMixer,ambienceMix,binLidRanges,firstSoundCue} from '/games/robberfather/audio-samples.js?v=ui-editor-v26';let c,m,mode='day',focus=0,chasers=[];const report=document.getElementById('report');function state(){if(!m)return;const mix=ambienceMix({mode,chasers},focus);m.update(mix);report.textContent=JSON.stringify({loaded:Object.fromEntries(Object.entries(m.buffers).map(([k,b])=>[k,{seconds:b.duration,channels:b.numberOfChannels}])),doorOpening:m.buffers.door?binLidRanges(m.buffers.door).open:null,purchaseCue:m.buffers.buy?firstSoundCue(m.buffers.buy):null,binRanges:m.buffers.bin?binLidRanges(m.buffers.bin):null,mix},null,2);}
document.getElementById('load').onclick=async()=>{c=new AudioContext();m=new SampleMixer(c,c.destination);await m.ready;state();const data=m.buffers.bin.getChannelData(0),ctx=document.getElementById('wave').getContext('2d');ctx.strokeStyle='#234';ctx.beginPath();for(let i=0;i<1000;i++){let max=0;for(let j=Math.floor(i*data.length/1000);j<Math.floor((i+1)*data.length/1000);j++)max=Math.max(max,Math.abs(data[j]));ctx.moveTo(i,70-max*65);ctx.lineTo(i,70+max*65);}ctx.stroke();};document.getElementById('open').onclick=()=>m?.lid(true);document.getElementById('close').onclick=()=>m?.lid(false);document.getElementById('night').onclick=()=>{mode='night';state()};document.getElementById('street').onclick=()=>{mode='day';state()};document.getElementById('focus').oninput=e=>{focus=Number(e.target.value);state()};document.getElementById('chase').onclick=()=>{mode='day';chasers=chasers.length?[]:[0];state()};document.getElementById('qte').onclick=()=>m?.effect('qte');document.getElementById('pocket').onclick=()=>m?.effect('pocket');document.getElementById('meal').onclick=()=>m?.effect('cutlery');document.getElementById('buy').onclick=()=>m?.effect('buy');document.getElementById('door').onclick=()=>m?.effect('door');document.getElementById('discard').onclick=()=>m?.effect('discard');document.getElementById('entry').onclick=()=>m?.effect('pocketOpen');document.getElementById('walk').onclick=()=>m?.step('concrete',false);document.getElementById('run').onclick=()=>m?.step('concrete',true);document.getElementById('wood').onclick=()=>m?.step('wood',false);document.getElementById('stop').onclick=()=>m?.update({});</script></html>
