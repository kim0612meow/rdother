<!doctype html><meta charset="utf-8"><title>QTE rollback check</title><link rel="stylesheet" href="/games/robberfather/game.css?v=music-installed-v37"><style>html,body{overflow:auto;background:#182820;color:#fff;font:18px sans-serif}body{padding:18px}button{padding:12px;margin:5px;background:#304b3f;color:#fff;border:1px solid #a8b6a8;border-radius:6px}#practice{position:relative;inset:auto;transform:none;width:640px;margin:20px auto}#report{text-align:center}header{text-align:center}</style><header><button id="reset">지갑 진행도 75%로 준비</button><button id="miss">SPACE 실패</button><button id="hit">SPACE 성공</button></header><div id="practice" class="pickpocket"><div class="pick-top"><strong data-pick-title></strong><small data-pick-hint></small></div><canvas width="640" height="400"></canvas><div class="pick-track"><div data-pick-bar></div></div></div><p id="report"></p><script type="module">
import {Pickpocket} from '/games/robberfather/pickpocket.js?v=music-installed-v37';import {setLocale,t} from '/games/robberfather/i18n.js?v=music-installed-v37';import {ready} from '/games/robberfather/characters.js?v=music-installed-v37';await ready;setLocale('ko');const p=new Pickpocket(document.getElementById('practice'),t),report=document.getElementById('report');function prepare(){p.open({id:0,type:'civilian'},72);p.game.index=Math.round((p.game.path.length-1)*.75);p.game.grabbing=true;p.game.pointer=p.game.path[p.game.index];p.gauge.running=true;p.render();report.textContent='실패 전 지갑 진행도: '+Math.round(p.fraction*100)+'%';}function tap(success){const before=p.fraction;p.gauge.flash=0;p.gauge.hit=0;p.gauge.running=true;p.gauge.pos=success?(p.gauge.zone[0]+p.gauge.zone[1])/2:0;p.tap();p.update(.001);report.textContent=(success?'성공':'실패')+': '+Math.round(before*100)+'% → '+Math.round(p.fraction*100)+'% · '+(p.touching?'잡고 있음':'지갑을 다시 잡으세요');}document.getElementById('reset').onclick=prepare;document.getElementById('miss').onclick=()=>tap(false);document.getElementById('hit').onclick=()=>tap(true);prepare();</script>
