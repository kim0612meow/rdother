<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>Game review</title>
<style>html{scrollbar-width:none}::-webkit-scrollbar{display:none}body{margin:0;background:#17251f;color:white;font:16px system-ui;width:1280px}iframe{display:block;width:1280px;height:720px;border:0}button{font:inherit;padding:10px;margin:8px;background:#eed097;border:0;border-radius:5px}pre{white-space:pre-wrap;padding:14px;margin:0}</style>
<iframe id="frame" title="실제 게임" src="/games/robberfather/"></iframe>
<button id="audit">검사</button><button data-size="1090,870">1090×870</button><button data-size="1280,720">1280×720</button><button data-size="2100,900">2100×900</button>
<pre id="report">게임 화면을 조작한 뒤 검사 버튼을 누르세요.</pre>
<script>
const gameFrame=document.getElementById('frame'),audit=document.getElementById('audit'),report=document.getElementById('report');
function size(w,h){gameFrame.style.width=w+'px';gameFrame.style.height=h+'px';document.body.style.width=w+'px';gameFrame.title=w+'×'+h+' 실제 게임';audit.textContent=w+'×'+h+' 검사';document.title='Game review · '+w+'×'+h;}
const params=new URLSearchParams(location.search);size(Number(params.get('w'))||1280,Number(params.get('h'))||720);
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>size(...button.dataset.size.split(',').map(Number)));
audit.onclick=()=>{
 const d=gameFrame.contentDocument,w=gameFrame.contentWindow,r=d.getElementById('stage').getBoundingClientRect(),modal=d.querySelector('.modal'),visible=e=>!!e&&e.getClientRects().length>0;
 const el=d.getElementById('game'),ctx=el.getContext('2d'),sample=[.1,.5,.9].map(x=>[...ctx.getImageData(Math.floor(el.width*x),2,1,1).data]);
 report.textContent=JSON.stringify({canvas:[el.width,el.height],canvasScale:[r.width/el.width,r.height/el.height],topPixels:sample,viewport:[w.innerWidth,w.innerHeight],stage:[r.width,r.height],scrollPosition:[w.scrollX,w.scrollY],documentScroll:[d.documentElement.scrollWidth-w.innerWidth,d.documentElement.scrollHeight-w.innerHeight],outsidePageElements:d.querySelectorAll('header,footer,.under-stage,.story-strip,.above-stage').length,resourceGroups:d.querySelectorAll('#resourceHud .hud-group').length,coinRows:d.querySelectorAll('#coinSlots').length,foodRows:d.querySelectorAll('#foodSlots').length,chances:d.getElementById('attemptSlots').getAttribute('aria-label'),modalVisible:visible(modal),modalScroll:visible(modal)?modal.scrollHeight-modal.clientHeight:0,modalButtons:visible(modal)?[...modal.querySelectorAll('button')].filter(visible).map(e=>e.textContent.trim()):[],pickVisible:visible(d.getElementById('pickpocket')),guideTables:d.querySelectorAll('#modalBody table').length,pickInstructions:d.querySelectorAll('#pickpocket [data-pick-hint]').length},null,2);
};
</script></html>
